name: Build APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Scaffold Android
        run: |
          [ -f pubspec.yaml ] && cp pubspec.yaml /tmp/pubspec.yaml.orig
          [ -d lib ] && cp -r lib /tmp/lib.orig
          flutter create --platforms android \
            --project-name galeri --org com.galeri .
          [ -f /tmp/pubspec.yaml.orig ] && cp /tmp/pubspec.yaml.orig pubspec.yaml
          [ -d /tmp/lib.orig ] && rm -rf lib && cp -r /tmp/lib.orig lib

      - name: Cache Keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Generate Keystore if not cached
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Fix SDK and Signing
        run: |
          GRADLE_FILE=android/app/build.gradle
          
          # Paksa Android SDK 36 untuk photo_manager
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' $GRADLE_FILE
          
          # Gunakan keystore dari cache
          sed -i '/signingConfigs {/,/}/d' $GRADLE_FILE
          sed -i '/buildTypes {/i\
              signingConfigs {\
                  release {\
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")\
                      storePassword "android"\
                      keyAlias "androiddebugkey"\
                      keyPassword "android"\
                  }\
              }\
          ' $GRADLE_FILE
          sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/g' $GRADLE_FILE
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' $GRADLE_FILE

      - name: Inject Android Permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION" />\n    <application|' $MANIFEST

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk galeri.apk

      - name: Upload APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: galeri.apk
